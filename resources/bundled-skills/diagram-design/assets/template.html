<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram</title>
<style>
:root{--paper:#fbfcfe;--paper-2:#eef2f7;--ink:#222;--muted:#5f6878;--rule:rgba(15,23,42,.12);--accent:#0088ff;--accent-soft:rgba(0,136,255,.14);font-family:ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}main{padding:32px}svg{display:block;width:100%;height:auto}text{font-family:inherit}.technical{font-family:ui-monospace,SFMono-Regular,monospace}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main data-kun-diagram-root>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Diagram title</title>
<desc id="diagram-desc">One sentence describing the content and relationships.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="var(--muted)"/></marker></defs>
<!-- zones; connectors with data-kun-connector; nodes with data-kun-node -->
</svg>
</main>
</body>
</html>
