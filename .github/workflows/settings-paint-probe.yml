name: Bounded native Settings paint diagnostic

on:
  push:
    branches: ['codex/settings-paint-probe']

permissions:
  contents: read

concurrency:
  group: settings-paint-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-paint:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install dependencies and native Electron
        run: |
          npm ci
          npm run ensure:electron
      - name: Assert unchanged frozen production source
        run: |
          node --input-type=module <<'NODE'
          import { assertFrozenSettingsProduction } from './scripts/settings-ui-paint-probe.mjs'
          console.log(JSON.stringify(assertFrozenSettingsProduction(process.cwd()), null, 2))
          NODE
      - name: Test instrumentation and existing geometry contracts
        run: |
          node --test scripts/settings-ui-paint-probe.test.mjs scripts/settings-ui-paint-probe-dom.test.mjs scripts/settings-ui-smoke-geometry.test.mjs
      - name: Capture every initial and delayed native frame
        shell: bash
        env:
          DEBUG: pw:browser
          KUN_SETTINGS_EVIDENCE: dist/settings-paint-probe
        run: |
          mkdir -p dist/settings-paint-probe
          node scripts/smoke-settings-ui.mjs --paint-probe 2>&1 | tee dist/settings-paint-probe/launch.log
      - name: Assert bounded evidence without dropping frames
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat } from 'node:fs/promises'
          import assert from 'node:assert/strict'
          const root = 'dist/settings-paint-probe'
          let bytes = 0
          for (const name of await readdir(root)) bytes += (await stat(`${root}/${name}`)).size
          console.log(`All evidence retained: ${bytes} bytes`)
          assert.ok(bytes < 24 * 1024 * 1024, 'Probe evidence must remain below the download limit')
          NODE
      - name: Preserve all native frames and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-paint-macos-attempt-${{ github.run_attempt }}
          path: dist/settings-paint-probe
          retention-days: 14
          if-no-files-found: error
