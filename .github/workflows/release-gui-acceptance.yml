name: Verify artifacts and publish stable latest
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing unpublished candidate version
        required: true
        type: string
      tag:
        description: Existing unpublished candidate tag
        required: true
        type: string
      commit:
        description: Exact commit referenced by the candidate tag
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stable-candidate-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    name: Promote verified stable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_COMMIT: ${{ inputs.commit }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Test artifact verification helpers
        run: node --test scripts/release-candidate-source.test.cjs scripts/public-release-download.test.mjs scripts/verify-public-release.test.mjs
      - name: Verify candidate tag and draft before promotion
        run: node scripts/release-candidate-source.cjs
      - name: Read GitHub candidate metadata
        run: gh release view "$TAG_NAME" --json assets,tagName,isDraft > candidate-release.json
      - name: Verify candidate bytes and save previous public manifests
        run: node scripts/verify-public-release.mjs candidate
      - name: Promote R2 latest
        run: node scripts/publish-r2.mjs promote --tag "$TAG_NAME" --channel stable --platforms mac,win,linux --require-all-platforms
      - name: Read back public stable feeds and download their artifacts
        run: node scripts/verify-public-release.mjs latest
      - name: Publish GitHub Release
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-promotion-evidence
          path: public-release-evidence/**
          if-no-files-found: error
          retention-days: 30
