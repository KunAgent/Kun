name: CI test suites

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'

jobs:
  scripts:
    name: Extension, packaging and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build workspace test dependencies
        # The old quality job built these during typecheck before npm test.
        # Independent runners must prepare the SDK test harness themselves.
        run: npm run build:extensions
      - name: Test extensions
        run: npm run test:extensions
      - name: Test packaging contracts
        run: npm run test:packaging
      - name: Test release workflows
        run: npm run test:release-workflows
      - name: Test Kun build and test runners
        run: npm --prefix kun run test:scripts

  vitest:
    name: ${{ matrix.suite }} tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [gui, kun]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: GUI unit tests
        if: matrix.suite == 'gui'
        run: npx vitest run --shard=${{ matrix.shard }}/4
      - name: Kun unit tests with native ABI routing
        if: matrix.suite == 'kun'
        working-directory: kun
        env:
          KUN_TEST_SHARD: ${{ matrix.shard }}/4
        # Preserve the large-history regression's isolated process and Electron
        # SQLite routing; passing --shard directly to Vitest bypasses both.
        run: node scripts/run-tests.mjs
