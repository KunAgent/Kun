name: Native memory workbench smoke

on:
  pull_request:
    paths:
      - '.github/workflows/memory-workbench-smoke.yml'
      - 'scripts/smoke-memory-lifecycle.mjs'
      - 'scripts/fixtures/memory-lifecycle.tsx'
      - 'scripts/fixtures/memory-lifecycle-backend.ts'
      - 'scripts/memory-lifecycle-backend.test.mjs'
      - 'scripts/memory-cjk-fonts.mjs'
      - 'scripts/memory-cjk-fonts.test.mjs'
      - 'src/renderer/src/components/memory/**'
      - 'src/renderer/src/components/rooms/*Memory*'
      - 'src/renderer/src/components/rooms/agents.css'
      - 'src/renderer/src/components/chat/injected-memory*'
      - 'src/renderer/src/components/settings-section-memory*'
      - 'src/shared/*memory*'
      - 'kun/src/contracts/memory*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-memory:
    name: Electron memory lifecycle and project preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install dependencies and Electron
        run: |
          npm ci
          npm run ensure:electron
      - name: Install and verify CJK fonts for native screenshots
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fontconfig
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC:lang=zh-cn' | grep -F 'Noto Sans CJK SC'
      - name: Verify memory UI and interoperability contracts
        run: >-
          npx vitest run
          src/renderer/src/components/rooms/AgentMemoryPanel.test.ts
          src/renderer/src/components/memory/ProjectKnowledgePanel.test.ts
          src/renderer/src/components/memory/MemoryHistory.test.ts
          src/shared/project-memory-interoperability.test.ts
          src/main/services/memory-export-service.test.ts
          src/renderer/src/components/chat/injected-memory-lookup.test.ts
          src/renderer/src/components/chat/injected-memory-details.test.ts
          src/renderer/src/components/rooms/RoomMemoryReceipt.test.ts
          src/renderer/src/agent/kun-runtime-memory-lifecycle.test.ts
          src/renderer/src/agent/kun-runtime-memory-feedback.test.ts
      - name: Verify real isolated store lifecycle and anti-replay
        run: node --test scripts/memory-lifecycle-backend.test.mjs scripts/memory-cjk-fonts.test.mjs
      - name: Exercise real memory components and stores in isolated native Electron
        env:
          KUN_MEMORY_EVIDENCE: dist/memory-workbench
        run: |
          mkdir -p dist/memory-workbench
          set -o pipefail
          xvfb-run -a node scripts/smoke-memory-lifecycle.mjs --electron 2>&1 | tee dist/memory-workbench/launch.log
      - name: Require successful native report and screenshots
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, readdirSync } from 'node:fs'
          import { assertCjkFontReport } from './scripts/memory-cjk-fonts.mjs'
          const directory = 'dist/memory-workbench'
          const report = JSON.parse(readFileSync(`${directory}/results.json`, 'utf8'))
          assert.equal(report.status, 'passed')
          assert.equal(report.engine, 'native-electron')
          assert.ok(report.results.length > 0)
          assert.equal(report.errors.length, 0)
          for (const size of ['wide', 'narrow']) {
            assertCjkFontReport(JSON.parse(readFileSync(`${directory}/cjk-fonts-${size}.json`, 'utf8')))
          }
          const persistence = JSON.parse(readFileSync(`${directory}/persistence-report.json`, 'utf8'))
          assert.deepEqual(persistence.erasure, { fileExists: false, retainedHistory: false, replayRecreated: false,
            unrelatedProjectRetained: true, sourceConversationRetained: true, sourceMessageRetained: true })
          assert.ok(readdirSync(directory).filter(name => name.startsWith('electron-') && name.endsWith('.png')).length >= 8)
          NODE
      - name: Upload native screenshots and interaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-workbench
          path: dist/memory-workbench
          if-no-files-found: error
          retention-days: 14
