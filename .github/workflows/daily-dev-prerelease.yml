name: Daily Dev Prerelease

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC,对应 Asia/Shanghai 的 12:00 和次日 00:00。
    - cron: '0 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: daily-dev-prerelease
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_CHANNEL: frontier

jobs:
  prepare:
    name: Prepare dev version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      dev_version: ${{ steps.version.outputs.dev_version }}
      head_sha: ${{ steps.version.outputs.head_sha }}
      release_name: ${{ steps.version.outputs.release_name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Compute dev version
        id: version
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          dev_version="$(date +'%Y%m%d.%H%M')"
          app_version="0.0.0-dev-${dev_version//./-}"
          tag="dev-${dev_version}"
          release_name="Kun Dev ${dev_version}"
          head_sha="$(git rev-parse HEAD)"

          node -e '
            const semver = require("semver")
            const [appVersion, devVersion] = process.argv.slice(1)
            if (!/^\d{8}\.\d{4}$/.test(devVersion)) throw new Error(`invalid daily dev version: ${devVersion}`)
            if (!semver.valid(appVersion)) throw new Error(`invalid daily app SemVer: ${appVersion}`)
            if (!semver.prerelease(appVersion)?.some((part) => String(part).startsWith("dev-"))) throw new Error(`daily app version is not a dev prerelease: ${appVersion}`)
          ' "${app_version}" "${dev_version}"

          {
            echo "app_version=${app_version}"
            echo "dev_version=${dev_version}"
            echo "head_sha=${head_sha}"
            echo "release_name=${release_name}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Dev version: ${dev_version}"
          echo "App version: ${app_version}"
          echo "Commit: ${head_sha}"

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - prepare
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      # The renderer bundle can exceed Node's default ~2 GiB heap on the
      # macOS ARM runner. Keep prerelease packaging consistent with PR and
      # stable release builds.
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run dist:mac

      - name: Smoke packaged update handoff (host-native macOS)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node -p 'process.arch')" == "arm64" ]]; then
            resources="dist/mac-arm64/Kun.app/Contents/Resources"
          else
            resources="dist/mac/Kun.app/Contents/Resources"
          fi
          npm run smoke:packaged-update-handoff -- --resources "${resources}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-mac-*.dmg
            dist/Kun-*-mac-*.zip
            dist/Kun-*-mac-*.blockmap
            dist/latest-mac.yml

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90
    needs:
      - prepare
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Windows update rollback failpoints
        env:
          KUN_INSTALLER_TEST_ARTIFACT_ROOT: ${{ github.workspace }}\artifacts\windows-installer-transaction
        run: npx vitest run src/main/windows-installer-migration.transaction.test.ts

      - name: Upload Windows transaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-windows-installer-transaction-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/windows-installer-transaction/**/diagnostic.log
            artifacts/windows-installer-transaction/**/journal.json
            artifacts/windows-installer-transaction/**/transaction.json
            artifacts/windows-installer-transaction/**/result-*.txt
            artifacts/windows-installer-transaction/**/fixture-summary.json

      - name: Build Windows installer
        run: npm run dist:win

      - name: Smoke Windows installer migration
        timeout-minutes: 60
        run: npm run smoke:windows-installer-migration -- -InstallerPath (Get-ChildItem dist/Kun-*-win-x64.exe | Select-Object -First 1 -ExpandProperty FullName)

      - name: Smoke packaged update handoff (Windows)
        timeout-minutes: 20
        run: npm run smoke:packaged-update-handoff -- --resources dist/win-unpacked/resources

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-win-x64.exe
            dist/Kun-*-win-x64.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - prepare
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 xvfb xauth

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke packaged update handoff (Linux x64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          # Exercise the packaged Chromium sandbox instead of bypassing it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-unpacked/resources

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-linux-x86_64.AppImage
            dist/Kun-*-linux-x86_64.AppImage.blockmap
            dist/Kun-*-linux-amd64.deb
            dist/latest-linux.yml

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    needs:
      - prepare
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 cmake file xvfb xauth

      - name: Install dependencies
        run: npm ci

      - name: Build Linux ARM64 AppImage and deb
        run: npm run dist:linux:arm64

      - name: Verify Linux ARM64 package architecture
        run: >-
          node ./scripts/verify-linux-package-architecture.mjs
          --version "${{ needs.prepare.outputs.dev_version }}"
          --arch arm64
          --dist dist

      - name: Smoke packaged update handoff (Linux ARM64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-arm64-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-arm64-unpacked/resources

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-linux-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-linux-arm64.AppImage
            dist/Kun-*-linux-arm64.AppImage.blockmap
            dist/Kun-*-linux-arm64.deb
            dist/latest-linux-arm64.yml

  build-tui:
    name: Build standalone TUI prerelease (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up packaged Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix kun ci

      - name: Build shared Kun runtime
        run: npm run build:kun

      - name: Package standalone TUI prerelease
        run: >-
          npm run package:tui --
          --version "${{ needs.prepare.outputs.app_version }}"
          --artifact-version "${{ needs.prepare.outputs.dev_version }}"
          --tag "${{ needs.prepare.outputs.tag }}"
          --channel frontier
          --commit "${{ needs.prepare.outputs.head_sha }}"
          --target "${{ matrix.target }}"
          --output dist

      - name: Upload standalone TUI prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-tui-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-TUI-*.tar.gz
            dist/Kun-TUI-*.zip
            dist/Kun-TUI-*.sha256
            dist/Kun-TUI-*.json

  publish:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
      - build-linux-arm64
      - build-tui
    env:
      GH_TOKEN: ${{ github.token }}
      DEV_VERSION: ${{ needs.prepare.outputs.dev_version }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: frontier
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download daily dev artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: daily-dev-*
          path: release-artifacts
          merge-multiple: true

      - name: Rebuild shared GUI/TUI runtime identity
        env:
          KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
          KUN_UPDATE_CHANNEL: frontier
        run: npm run build:kun

      - name: Verify daily dev artifacts
        run: |
          set -euo pipefail
          required=(
            "Kun-${DEV_VERSION}-mac-arm64.dmg"
            "Kun-${DEV_VERSION}-mac-x64.dmg"
            "Kun-${DEV_VERSION}-mac-arm64.zip"
            "Kun-${DEV_VERSION}-mac-x64.zip"
            "Kun-${DEV_VERSION}-win-x64.exe"
            "Kun-${DEV_VERSION}-linux-x86_64.AppImage"
            "Kun-${DEV_VERSION}-linux-amd64.deb"
            "Kun-${DEV_VERSION}-linux-arm64.AppImage"
            "Kun-${DEV_VERSION}-linux-arm64.deb"
            "latest-mac.yml"
            "latest.yml"
            "latest-linux.yml"
            "latest-linux-arm64.yml"
            "Kun-TUI-${DEV_VERSION}-mac-arm64.tar.gz"
            "Kun-TUI-${DEV_VERSION}-mac-x64.tar.gz"
            "Kun-TUI-${DEV_VERSION}-win-x64.zip"
            "Kun-TUI-${DEV_VERSION}-linux-x64.tar.gz"
            "Kun-TUI-${DEV_VERSION}-linux-arm64.tar.gz"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "release-artifacts/${file}" ]]; then
              echo "::error::Missing release artifact ${file}"
              find release-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
          done

          find release-artifacts -maxdepth 2 -type f -print | sort

      - name: Assemble standalone TUI prerelease contract
        run: >-
          npm run assemble:tui-release --
          --directory release-artifacts
          --version "${APP_VERSION}"
          --artifact-version "${DEV_VERSION}"
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --commit "${HEAD_SHA}"
          --expected-build-id "$(node -p "require('./kun/dist/runtime-build.json').buildId")"
          --public-base-url "${R2_PUBLIC_BASE_URL}"
          --release-prefix "${R2_RELEASE_PREFIX:-deepseek-gui}"

      - name: Generate prerelease notes
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA::7}"
          cat > release-notes.md <<EOF
          Daily dev prerelease built from develop.

          ### Build information

          - Dev version: \`${DEV_VERSION}\`
          - App version: \`0.0.0-dev-${DEV_VERSION//./-}\`
          - Branch: \`develop\`
          - Commit: \`${short_sha}\`
          - Platforms: macOS arm64/x64, Windows x64, Linux arm64/x64 AppImage/deb
          - Standalone TUI: macOS arm64/x64, Windows x64, Linux arm64/x64
          EOF

      - name: Ensure prerelease tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            tag_sha="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${tag_sha}" != "${HEAD_SHA}" ]]; then
              echo "::error::Tag ${TAG_NAME} points at ${tag_sha}, expected ${HEAD_SHA}"
              exit 1
            fi
            echo "Reusing existing tag ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "${RELEASE_NAME}" "${HEAD_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Create or update draft GitHub prerelease
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --draft \
              --prerelease
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --verify-tag \
              --prerelease
          fi

      - name: Upload GitHub prerelease assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-artifacts -type f \
              \( -name 'Kun-*' -o -name 'latest*.yml' -o -name 'release-tui.json' -o -name 'SHA256SUMS-tui.txt' \) \
              -print0
          )

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

      - name: Upload unified prerelease archive to R2
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs upload --platform mac --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform win --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform linux --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload-tui --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"

      - name: Promote unified prerelease on R2
        run: >-
          node ./scripts/publish-r2.mjs promote
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --platforms mac,win,linux
          --require-tui

      - name: Publish GitHub prerelease
        run: gh release edit "${TAG_NAME}" --draft=false --prerelease --latest=false
