name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  package:
    name: Build Linux package (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 xvfb xauth

      - name: Install root dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke packaged update handoff (Linux x64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          # Exercise the packaged Chromium sandbox instead of bypassing it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-unpacked/resources

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-linux-x86_64.AppImage
            dist/Kun-*-linux-x86_64.AppImage.blockmap
            dist/Kun-*-linux-amd64.deb

  package-linux-arm64:
    name: Build Linux package and TUI (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 cmake file xvfb xauth

      - name: Install root dependencies
        run: npm ci

      - name: Build standalone TUI (host-native ARM64)
        run: |
          version="$(node -p "require('./kun/package.json').version")"
          export KUN_APP_VERSION="${version}"
          export KUN_ARTIFACT_VERSION="${version}"
          export KUN_UPDATE_CHANNEL=stable
          export RELEASE_CHANNEL=stable
          npm run build:kun
          npm run package:tui -- \
            --version "${version}" \
            --artifact-version "${version}" \
            --tag "v${version}" \
            --channel stable \
            --commit "${GITHUB_SHA}" \
            --target linux-arm64 \
            --output dist/tui-pr

      - name: Build Linux ARM64 AppImage and deb
        run: npm run dist:linux:arm64

      - name: Verify Linux ARM64 package architecture
        run: >-
          node ./scripts/verify-linux-package-architecture.mjs
          --version "$(node -p "require('./package.json').version")"
          --arch arm64
          --dist dist

      - name: Smoke packaged update handoff (Linux ARM64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-arm64-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-arm64-unpacked/resources

      - name: Upload Linux ARM64 PR package
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-arm64-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-linux-arm64.AppImage
            dist/Kun-*-linux-arm64.AppImage.blockmap
            dist/Kun-*-linux-arm64.deb
            dist/latest-linux-arm64.yml
            dist/tui-pr/Kun-TUI-*-linux-arm64.tar.gz
            dist/tui-pr/Kun-TUI-*-linux-arm64.tar.gz.sha256
            dist/tui-pr/Kun-TUI-*-linux-arm64.tar.gz.json

  package-macos:
    name: Build ad-hoc macOS packages (PR)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # PR validation intentionally uses the afterPack ad-hoc signature only.
      # It never consumes Developer ID or notarization secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The renderer bundle can exceed Node's default ~2 GiB heap on the
      # macOS ARM runner. Keep the PR build aligned with release packaging.
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build ad-hoc macOS packages (x64 and arm64)
        run: npm run dist:mac

      - name: Smoke packaged update handoff (host-native macOS)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node -p 'process.arch')" == "arm64" ]]; then
            resources="dist/mac-arm64/Kun.app/Contents/Resources"
          else
            resources="dist/mac/Kun.app/Contents/Resources"
          fi
          npm run smoke:packaged-update-handoff -- --resources "${resources}"

      - name: Upload ad-hoc macOS PR packages
        uses: actions/upload-artifact@v4
        with:
          name: pr-macos-adhoc-packages
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-mac-*.dmg
            dist/Kun-*-mac-*.zip
            dist/Kun-*-mac-*.blockmap
            dist/latest-mac.yml

  package-windows:
    name: Build Windows NSIS installer (PR)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build standalone TUI (host-native Windows)
        shell: pwsh
        run: |
          $version = node -p "require('./kun/package.json').version"
          $env:KUN_APP_VERSION = $version
          $env:KUN_ARTIFACT_VERSION = $version
          $env:KUN_UPDATE_CHANNEL = 'stable'
          $env:RELEASE_CHANNEL = 'stable'
          npm run build:kun
          npm run package:tui -- `
            --version $version `
            --artifact-version $version `
            --tag "v$version" `
            --channel stable `
            --commit $env:GITHUB_SHA `
            --target win32-x64 `
            --output dist/tui-pr
      - name: Test Windows update rollback failpoints
        env:
          KUN_INSTALLER_TEST_ARTIFACT_ROOT: ${{ github.workspace }}\artifacts\windows-installer-transaction
        run: npx vitest run src/main/windows-installer-migration.transaction.test.ts

      - name: Upload Windows transaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-windows-installer-transaction-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            artifacts/windows-installer-transaction/**/diagnostic.log
            artifacts/windows-installer-transaction/**/journal.json
            artifacts/windows-installer-transaction/**/transaction.json
            artifacts/windows-installer-transaction/**/result-*.txt
            artifacts/windows-installer-transaction/**/fixture-summary.json

      - name: Build Windows NSIS installer
        run: npm run dist:win

      - name: Smoke Windows installer migration
        timeout-minutes: 60
        run: npm run smoke:windows-installer-migration -- -InstallerPath (Get-ChildItem dist/Kun-*-win-x64.exe | Select-Object -First 1 -ExpandProperty FullName)

      - name: Smoke packaged update handoff (Windows)
        timeout-minutes: 20
        run: npm run smoke:packaged-update-handoff -- --resources dist/win-unpacked/resources

      - name: Upload Windows PR package
        uses: actions/upload-artifact@v4
        with:
          name: pr-windows-nsis-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-win-x64.exe
            dist/Kun-*-win-x64.exe.blockmap
            dist/latest.yml

  request-changes-on-failure:
    name: Request PR changes on failure
    runs-on: ubuntu-latest
    needs:
      - package
      - package-linux-arm64
      - package-macos
      - package-windows
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          needs.package.result == 'failure' ||
          needs['package-linux-arm64'].result == 'failure' ||
          needs['package-macos'].result == 'failure' ||
          needs['package-windows'].result == 'failure'
        )
      }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request changes
        uses: actions/github-script@v7
        with:
          script: |
            const failedJobs = [
              ['Build Linux package', '${{ needs.package.result }}'],
              ['Build Linux package and TUI (ARM64)', '${{ needs['package-linux-arm64'].result }}'],
              ['Build ad-hoc macOS packages (PR)', '${{ needs['package-macos'].result }}'],
              ['Build Windows NSIS installer (PR)', '${{ needs['package-windows'].result }}']
            ]
              .filter(([, result]) => result === 'failure')
              .map(([name]) => `- ${name}`)
              .join('\n')

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'PR checks failed. Please fix the failing CI jobs before merging.',
              '',
              failedJobs ? `Failed jobs:\n${failedJobs}` : 'At least one required job failed.',
              '',
              `Run details: ${runUrl}`
            ].join('\n')

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'REQUEST_CHANGES',
              body
            })
