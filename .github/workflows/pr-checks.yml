name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  GH_TOKEN: ${{ github.token }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm run audit:production

  package:
    name: Build Linux package (x64)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 xvfb xauth

      - name: Install root dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke packaged update handoff (Linux x64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          # Exercise the packaged Chromium sandbox instead of bypassing it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-unpacked/resources

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-linux-x86_64.AppImage
            dist/Kun-*-linux-x86_64.AppImage.blockmap
            dist/Kun-*-linux-amd64.deb

  package-linux-arm64:
    name: Build Linux package (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: quality
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 cmake file xvfb xauth

      - name: Install root dependencies
        run: npm ci

      - name: Build Linux ARM64 AppImage and deb
        run: npm run dist:linux:arm64

      - name: Verify Linux ARM64 package architecture
        run: >-
          node ./scripts/verify-linux-package-architecture.mjs
          --version "$(node -p "require('./package.json').version")"
          --arch arm64
          --dist dist

      - name: Smoke packaged update handoff (Linux ARM64)
        timeout-minutes: 20
        env:
          KUN_CI_ALLOW_NO_SANDBOX: '1'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node ./scripts/configure-linux-chrome-sandbox.cjs --resources dist/linux-arm64-unpacked/resources
          npm run smoke:packaged-update-handoff -- --resources dist/linux-arm64-unpacked/resources

      - name: Upload Linux ARM64 PR package
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-arm64-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-linux-arm64.AppImage
            dist/Kun-*-linux-arm64.AppImage.blockmap
            dist/Kun-*-linux-arm64.deb
            dist/latest-linux-arm64.yml

  package-macos:
    name: Build ad-hoc macOS packages (PR)
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 90
    env:
      # PR validation intentionally uses the afterPack ad-hoc signature only.
      # It never consumes Developer ID or notarization secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The renderer bundle can exceed Node's default ~2 GiB heap on the
      # macOS ARM runner. Keep the PR build aligned with release packaging.
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build ad-hoc macOS packages (x64 and arm64)
        run: npm run dist:mac

      - name: Smoke packaged update handoff (host-native macOS)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node -p 'process.arch')" == "arm64" ]]; then
            resources="dist/mac-arm64/Kun.app/Contents/Resources"
          else
            resources="dist/mac/Kun.app/Contents/Resources"
          fi
          npm run smoke:packaged-update-handoff -- --resources "${resources}"

      - name: Upload ad-hoc macOS PR packages
        uses: actions/upload-artifact@v4
        with:
          name: pr-macos-adhoc-packages
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-mac-*.dmg
            dist/Kun-*-mac-*.zip
            dist/Kun-*-mac-*.blockmap
            dist/latest-mac.yml

  package-windows:
    name: Build Windows NSIS installer (PR)
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 240
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Test Windows update rollback failpoints
        env:
          KUN_INSTALLER_TEST_ARTIFACT_ROOT: ${{ github.workspace }}\artifacts\windows-installer-transaction
        run: npx vitest run src/main/windows-installer-migration.transaction.test.ts

      - name: Upload Windows transaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-windows-installer-transaction-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            artifacts/windows-installer-transaction/**/diagnostic.log
            artifacts/windows-installer-transaction/**/journal.json
            artifacts/windows-installer-transaction/**/transaction.json
            artifacts/windows-installer-transaction/**/result-*.txt
            artifacts/windows-installer-transaction/**/fixture-summary.json

      - name: Build Windows NSIS installer
        run: npm run dist:win

      - name: Smoke Windows installer
        timeout-minutes: 180
        run: npm run smoke:windows-installer -- -InstallerPath (Get-ChildItem dist/Kun-*-win-x64.exe | Select-Object -First 1 -ExpandProperty FullName)

      - name: Smoke packaged update handoff (Windows)
        timeout-minutes: 20
        run: npm run smoke:packaged-update-handoff -- --resources dist/win-unpacked/resources

      - name: Upload Windows PR package
        uses: actions/upload-artifact@v4
        with:
          name: pr-windows-nsis-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Kun-*-win-x64.exe
            dist/Kun-*-win-x64.exe.blockmap
            dist/latest.yml

  gui-upgrade-windows:
    name: GUI upgrade from released 0.3.7 (Windows)
    runs-on: windows-latest
    needs: package-windows
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: pr-windows-nsis-package
          path: dist
      - name: Verify GUI upgrade from the published 0.3.7 installer
        timeout-minutes: 60
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/smoke-gui-upgrade.cjs --directory dist --version $version --report gui-upgrade-win32.json

      - name: Upload GUI upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gui-upgrade-windows
          path: |
            gui-upgrade-win32.json*
            ${{ env.GUI_UPGRADE_EVIDENCE }}/kun-gui-upgrade-*/**
            !${{ env.GUI_UPGRADE_EVIDENCE }}/kun-gui-upgrade-*/installed/**
            !${{ env.GUI_UPGRADE_EVIDENCE }}/kun-gui-upgrade-*/**/*.exe
          if-no-files-found: warn

  pr-gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs:
      - quality
      - package
      - package-linux-arm64
      - package-macos
      - package-windows
      - gui-upgrade-windows
    if: always()
    steps:
      - name: Require every PR job to succeed
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              ['GUI upgrade from released 0.3.7 (Windows)', '${{ needs.gui-upgrade-windows.result }}'],
              ['Quality gates', '${{ needs.quality.result }}'],
              ['Build Linux package', '${{ needs.package.result }}'],
              ['Build Linux package (ARM64)', '${{ needs['package-linux-arm64'].result }}'],
              ['Build ad-hoc macOS packages (PR)', '${{ needs['package-macos'].result }}'],
              ['Build Windows NSIS installer (PR)', '${{ needs['package-windows'].result }}'],
            ]
            const unsuccessful = results.filter(([, result]) => result !== 'success')
            if (unsuccessful.length > 0) {
              core.setFailed(
                `Required jobs did not succeed:\n${unsuccessful
                  .map(([name, result]) => `- ${name} (${result})`)
                  .join('\n')}`
              )
            }

  report-pr-check-feedback:
    name: Report PR check feedback
    runs-on: ubuntu-latest
    needs:
      - quality
      - package
      - package-linux-arm64
      - package-macos
      - package-windows
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      contents: read
      issues: write
      # Transitional: dismissReview needs this until stale bot reviews are gone.
      pull-requests: write
    steps:
      - name: Maintain CI feedback comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobResults = [
              ['Quality gates', '${{ needs.quality.result }}'],
              ['Build Linux package', '${{ needs.package.result }}'],
              ['Build Linux package (ARM64)', '${{ needs['package-linux-arm64'].result }}'],
              ['Build ad-hoc macOS packages (PR)', '${{ needs['package-macos'].result }}'],
              ['Build Windows NSIS installer (PR)', '${{ needs['package-windows'].result }}'],
            ]
            const failed = jobResults.filter(([, result]) => result !== 'success')
            const failedJobs = failed.map(([name, result]) => `- ${name} (${result})`).join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`

            // Transitional cleanup: dismiss CHANGES_REQUESTED reviews left by the
            // retired request-changes-on-failure job so they cannot block merging
            // once required reviews or conversation resolution is enabled.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100
            })
            for (const review of reviews) {
              if (review.user?.login === 'github-actions[bot]' && review.state === 'CHANGES_REQUESTED') {
                await github.rest.pulls.dismissReview({
                  owner,
                  repo,
                  pull_number: issue_number,
                  review_id: review.id,
                  message: 'CI feedback moved to a sticky comment; dismissing stale CI review.'
                })
              }
            }

            const MARKER = '<!-- kun-pr-checks-feedback -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            })
            const sticky = comments.filter(
              (c) => c.user?.login === 'github-actions[bot]' && (c.body ?? '').includes(MARKER)
            )

            if (failed.length === 0) {
              for (const comment of sticky) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
            } else {
              const body = [
                MARKER,
                'PR checks failed. Please fix the failing CI jobs before merging.',
                '',
                `Failed jobs:\n${failedJobs}`,
                '',
                `Run details: ${runUrl}`
              ].join('\n')

              const [keep, ...extra] = sticky.reverse() // listComments is ascending; keep the latest
              for (const comment of extra) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
              if (keep) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
            }
