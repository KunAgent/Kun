name: Kun npm native artifact matrix

on:
  workflow_dispatch:
    inputs:
      global_checks_only:
        description: Validate source typechecks, build and related tests against an immutable candidate
        type: boolean
        default: false
      windows_probe_only:
        description: Diagnose terminal behavior from an existing immutable candidate
        type: boolean
        default: false
      reuse_candidate_run_id:
        description: Reuse immutable candidate bytes from a previous accepted run
        type: string
        default: ''
      candidate_run_id:
        description: Original candidate run id for terminal diagnostics
        type: string
        default: ''

# This workflow only builds local tarballs and tests them. It cannot publish.
permissions:
  contents: read
  actions: read

concurrency:
  group: kun-npm-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-payload:
    if: ${{ !inputs.windows_probe_only && !inputs.global_checks_only && inputs.reuse_candidate_run_id == '' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - name: Install only the locked helper build tools and dependencies
        run: npm --prefix kun ci --ignore-scripts --no-audit --no-fund
      - name: Build ownership helpers on their native target
        run: npm run build:kun:npm-windows
      - uses: actions/upload-artifact@v4
        with:
          name: kun-npm-windows-payload
          path: kun/dist/native/win32-x64/
          if-no-files-found: error
          retention-days: 7

  candidate:
    if: ${{ always() && !inputs.windows_probe_only && !inputs.global_checks_only && (inputs.reuse_candidate_run_id != '' || needs.windows-payload.result == 'success') }}
    needs: windows-payload
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      sha256: ${{ steps.identity.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: kun-npm-windows-payload
          path: .cache/kun-npm-windows-payload
        if: ${{ inputs.reuse_candidate_run_id == '' }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_candidate_run_id != '' }}
        with:
          name: kun-npm-candidate
          path: .cache/kun-npm/artifacts
          run-id: ${{ inputs.reuse_candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Build one canonical candidate for every installation target
        if: ${{ inputs.reuse_candidate_run_id == '' }}
        run: npm run pack:kun:npm -- --windows-payload .cache/kun-npm-windows-payload
      - name: Verify and export immutable candidate identity
        id: identity
        run: node scripts/verify-kun-npm-candidate.mjs .cache/kun-npm/artifacts
      - name: Packaging contract tests
        run: npm run test:kun:npm
      - uses: actions/upload-artifact@v4
        with:
          name: kun-npm-candidate
          path: .cache/kun-npm/artifacts/
          if-no-files-found: error
          retention-days: 7

  install:
    if: ${{ always() && !inputs.windows_probe_only && !inputs.global_checks_only && needs.candidate.result == 'success' }}
    needs: candidate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['26.4.0', '26.12.0']
        target:
          - {id: darwin-arm64, runner: macos-15}
          - {id: darwin-x64, runner: macos-15-intel}
          - {id: win32-x64, runner: windows-2025}
          - {id: linux-arm64, runner: ubuntu-24.04-arm}
          - {id: linux-x64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.target.runner }}
    env:
      KUN_NPM_EXPECTED_TARGET: ${{ matrix.target.id }}
      KUN_NPM_EXPECTED_NODE: ${{ matrix.node }}
      KUN_NPM_CANDIDATE_SOURCE: ${{ needs.candidate.outputs.source_commit }}
      KUN_NPM_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: drivers-checkout
          # Only independent test drivers are available, never Runtime sources.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/smoke-kun-npm.mjs
            /scripts/probe-kun-npm-terminal.mjs
            /scripts/run-kun-npm-artifact-smoke.mjs
            /scripts/export-kun-npm-test-driver.mjs
            /scripts/lib/kun-npm-smoke-*
            /scripts/lib/kun-npm-artifact-*
            /scripts/fixtures/kun-npm/**
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Export test-only files
        shell: bash
        working-directory: drivers-checkout
        run: |
          node scripts/export-kun-npm-test-driver.mjs "$RUNNER_TEMP/kun-npm-driver"
      - name: Remove checkout and Git history after the exporter has exited
        shell: bash
        run: node -e 'require("node:fs").rmSync("drivers-checkout",{recursive:true,force:true,maxRetries:10,retryDelay:100})'
      - uses: actions/download-artifact@v4
        with:
          name: kun-npm-candidate
          path: candidate
      - name: Install and exercise the actual candidate
        shell: bash
        env:
          KUN_NPM_SMOKE_ROOT: ${{ runner.temp }}/kun-npm-consumer
        run: node "$RUNNER_TEMP/kun-npm-driver/scripts/run-kun-npm-artifact-smoke.mjs" candidate receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kun-npm-receipt-${{ matrix.target.id }}-${{ matrix.node }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 7

  evidence:
    needs: install
    if: ${{ always() && !inputs.windows_probe_only && !inputs.global_checks_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-kun-npm-matrix.mjs
            /kun/npm/release.json
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: kun-npm-receipt-*
          path: receipts
      - name: Check matrix smoke coverage
        run: node scripts/check-kun-npm-matrix.mjs receipts --smoke-only
      - name: Record remaining complete Gate A requirements
        run: node scripts/check-kun-npm-matrix.mjs receipts --report-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kun-npm-matrix-evidence
          path: |
            receipts/
            artifact-readiness.json
          retention-days: 7

  windows-terminal-probe:
    if: ${{ inputs.windows_probe_only && !inputs.global_checks_only }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['26.4.0', '26.12.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: kun-npm-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Diagnose the real terminal against frozen candidate bytes
        run: node scripts/probe-kun-npm-terminal.mjs candidate terminal-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kun-npm-terminal-probe-${{ matrix.node }}
          path: terminal-probe.json
          if-no-files-found: error

  build-validation:
    if: ${{ inputs.global_checks_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: kun-npm-candidate
          path: validation/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Record typecheck, build and related test evidence for the exact candidate
        run: node scripts/run-kun-npm-build-validation.mjs validation/candidate validation/build-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kun-npm-build-validation
          path: |
            validation/*.json
            validation/*.log
          if-no-files-found: error
          retention-days: 90
