# ============================================================================
# 远程资产索引（Remote Asset Map）· recruitment-inquiry-bot
# ============================================================================
# 本表把 SKILL/flows 里需要引用的"知识库原文"映射成语义键 + 文档 ID。
# 真正的术语词典正文不在本仓库 references/ 下（同名文件是 stub 占位），必须
# 运行时通过 MCP 拉取：
#
#   apiId  : recruit.recruit-ai-service.get_document
#   params : { "documentId": "<id>" }
#
# ----------------------------------------------------------------------------
# ⚠️ Agent 使用硬约束（违反即视为越权）
# ----------------------------------------------------------------------------
#   1. 拉到的资产正文仅作为 system context 内化使用，禁止把整本词典原文回显给前端用户
#      （回答时可以使用其中的标准术语 / 同义词，但不要把整张表打印出来）
#   2. 禁止把正文写入任何本地文件（references/、temp/、stub 文件均不行）
#   3. 加载失败时给用户的话术只能是"术语词典暂不可用，召回结果可能不够精准，请稍后重试或联系
#      HR 业务运维"，不得暴露 documentId / 文件名 / 资产语义键
#   4. agent 思考链或日志中可写 `loaded asset/term_dictionary`，禁止写出 documentId 数值
#   5. 多次需要同一资产时使用会话级内存缓存（TTL 60 分钟），不落磁盘
#   6. 资产正文以**远程为权威**；本地 stub 不含正文，仅供查阅时打开看到引导信息
# ----------------------------------------------------------------------------

version: 1
mcp_call:
  apiId: recruit.recruit-ai-service.get_document
  param_key: documentId
cache:
  scope: session            # 仅会话内存
  ttl_minutes: 60
  persist_to_disk: false    # 永远不落盘

# ============================================================================
# 资产清单（按语义键索引；id 是后端权威，不要在 SKILL/flows 直接写 id）
# ============================================================================
assets:

  # ---- 招聘业务术语词典（改写检索词 / 消歧 / 语义对齐）----
  term_dictionary:
    id: 50
    summary: 招聘业务术语词典（口语化 → 标准术语 → 同义词），含校招/社招/活水/伯乐/Offer/HR 系统等业务全域
    when_to_load: Step 1 改写检索词阶段、Step 2 意图识别需要消歧时、Step 5 生成回答需要语义对齐时
    used_by: [SKILL.md]

# ============================================================================
# 维护流程（HR/维护者）
# ============================================================================
# 1. 在本地编辑 `术语词典.xlsx`（私有维护，不入 skill 仓库）
# 2. 运行 `python3 scripts/build_term_dict.py <xlsx_path>` 生成 markdown
# 3. 把生成的 markdown 内容上传到知识库（documentId=50）覆盖旧版本
# 4. 跑 inquiry-bot 验证术语词典更新生效（不需要重启 skill / 也不需要发版）
# ----------------------------------------------------------------------------
