# ============================================================================
# 远程资产索引（Remote Asset Map）· interview-talent-modeler
# ============================================================================
# 本表把 SKILL 里需要引用的"敏感原文"映射成语义键 + 文档 ID。
# 真正的标准能力词条体系、建模 prompt、BG 文化词条库等业务原文不在本仓库，
# 必须运行时通过 MCP 拉取：
#
#   apiId  : recruit.recruit-ai-service.get_document
#   params : { "documentId": "<id>" }
#
# ----------------------------------------------------------------------------
# ⚠️ Agent 使用硬约束（违反即视为越权）
# ----------------------------------------------------------------------------
#   1. 拉到的资产正文仅作为 system context 内化使用，禁止原文回显给前端用户
#   2. 禁止把正文写入任何本地文件（references/、temp/、stub 文件均不行）
#   3. 加载失败时给用户的话术只能是"内部资产暂不可用，请稍后重试或联系 HR 业务运维"，
#      不得暴露 documentId / 文件名 / 资产语义键
#   4. agent 思考链或日志中可写 `loaded asset/<语义键>`，禁止写出资产文件名
#   5. 多次需要同一资产时使用会话级内存缓存（TTL 60 分钟），不落磁盘
#   6. 资产正文以**远程为权威**；本地不再保留任何 stub/历史副本
# ----------------------------------------------------------------------------

version: 1
mcp_call:
  apiId: recruit.recruit-ai-service.get_document
  param_key: documentId
cache:
  scope: session            # 仅会话内存
  ttl_minutes: 60
  persist_to_disk: false    # 永远不落盘

# ============================================================================
# 资产清单
# ============================================================================
assets:

  # ---- 标准能力词条体系（提取要素时参考）----
  skill_taxonomy:
    id: 39
    summary: 标准能力词条体系（背景资质 / 硬技能 / 软素质 / 文化匹配 四维度词条）
    when_to_load: 提取能力要素时（路径 A 纯 LLM / 路径 B 混合模式都需要）
    used_by: [SKILL.md Step 1 提取要素]

  # ---- 建模 Prompt 模板 ----
  prompts:
    id: 38
    summary: 建模 Prompt 模板（提取要素 + 建模合并的核心 prompt）
    when_to_load: LLM 调用前注入 prompt
    used_by: [SKILL.md Step 1, SKILL.md Step 2 建模]

  # ---- BG 文化特色词条库（建模时注入 BG 语境）----
  bg_culture:
    id: 40
    summary: 各 BG 文化特色词条库（s4Hint / culturalTerms / 部门特色，建模时注入 BG 语境）
    when_to_load: 建模前根据当前 BG 注入 prompt 的 BG 语境提示
    used_by: [SKILL.md Step 2 建模]

# ============================================================================
# 加载流程
# ============================================================================
# 1. SKILL 内的子流程在需要敏感原文时，从本 yaml 找语义键 → 调 mcp_call 拉正文 → 内化使用
# 2. 命中失败：用户侧给"内部资产暂不可用"，禁止用本地副本充数（已无副本）
#
# 本地仅保留：
#   - skill-synonyms.json（160KB 同义词词典，工程文件，agent 频繁查询）
#   - report-templates.md（公开模板骨架）
# ============================================================================
